name: Patch Collaborator Chat Events

on:
  push:
    branches: [feature/collaborator-chat-events]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[collaborator-events-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/collaborator-chat-events
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20.19.0
      - name: Apply collaborator event patch
        run: node scripts/patch-collaborator-chat-events.mjs
      - name: Commit collaborator event patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+anjal86@users.noreply.github.com"
          git add src/app/api/conversations/[id]/collaborators/route.ts src/components/inbox/StableInbox.tsx src/components/inbox/MetaConversationTimeline.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: log collaborator changes in conversation timeline [collaborator-events-patched]"
          git push origin HEAD:feature/collaborator-chat-events
