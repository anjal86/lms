name: Patch Inbox Collaboration Suite

on:
  push:
    branches: [feature/inbox-collaboration-suite]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[inbox-collaboration-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/inbox-collaboration-suite
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply Inbox collaboration integration
        run: node scripts/patch-inbox-collaboration-suite.mjs
      - name: Commit integration patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+anjal86@users.noreply.github.com"
          git add src/components/inbox/StableInbox.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate inbox collaboration suite [inbox-collaboration-patched]"
          git push origin feature/inbox-collaboration-suite
