name: Apply production integrations

on:
  push:
    branches: [main]
    paths:
      - scripts/finalize-production.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      LEADS_WEBHOOK_SECRET: ci-placeholder-secret-at-least-32-characters-long
      SLA_CRON_SECRET: ci-placeholder-sla-secret-at-least-32-characters-long
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/finalize-production.mjs
      - run: npm run check
      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Finish production UI integrations"
          git push origin HEAD:main
