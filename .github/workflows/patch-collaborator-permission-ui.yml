name: Patch Collaborator Permission UI

on:
  push:
    branches: [fix/collaborator-permission]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[collaborator-permission-ui-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/collaborator-permission
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply collaborator permission UI patch
        run: node scripts/patch-collaborator-permission-ui.mjs
      - name: Commit collaborator permission UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+anjal86@users.noreply.github.com"
          git add src/components/inbox/StableInbox.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: align collaborator UI with workspace permissions [collaborator-permission-ui-patched]"
          git push origin fix/collaborator-permission
