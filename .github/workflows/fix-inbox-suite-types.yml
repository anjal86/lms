name: Fix Inbox Collaboration Types

on:
  push:
    branches: [feature/inbox-collaboration-suite]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[inbox-types-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/inbox-collaboration-suite
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply type fixes
        run: node scripts/fix-inbox-suite-types.mjs
      - name: Commit type fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+anjal86@users.noreply.github.com"
          git add src/components/inbox/StableInbox.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: align Inbox collaboration message types [inbox-types-fixed]"
          git push origin feature/inbox-collaboration-suite
