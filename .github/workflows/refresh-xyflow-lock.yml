name: Refresh React Flow lockfile

on:
  push:
    branches: [feature/visual-automation-builder]
    paths:
      - package.json
      - .github/workflows/refresh-xyflow-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/visual-automation-builder
      - uses: actions/setup-node@v5
        with:
          node-version: 20.19.0
      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: refresh lockfile for React Flow"
          git push origin HEAD:feature/visual-automation-builder
