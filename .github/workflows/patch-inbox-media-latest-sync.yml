name: Patch Inbox Media Sync

on:
  push:
    branches: [fix/inbox-media-latest-sync]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/inbox-media-latest-sync
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20.19.0
      - name: Apply patch
        run: node scripts/patch-inbox-media-latest-sync.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/inbox/StableInbox.tsx src/lib/integrations/meta-sync.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: render inbox media and refresh latest messages [patched]"
          git push origin HEAD:fix/inbox-media-latest-sync
