name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      LEADS_WEBHOOK_SECRET: ci-placeholder-secret-at-least-32-characters-long
      SLA_CRON_SECRET: ci-placeholder-sla-secret-at-least-32-characters-long
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      POSTGRES_PASSWORD: ci-postgres-password-not-for-production
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      ANON_KEY: ci-placeholder-anon-key
      SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      SECRET_KEY_BASE: ci-realtime-secret-key-base-0123456789abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJ
      REALTIME_DB_ENC_KEY: ci-realtime-key12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Docker Compose
        run: docker compose -f docker/docker-compose.yml config --quiet
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
