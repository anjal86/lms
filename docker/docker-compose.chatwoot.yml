services:
  chatwoot-postgres:
    image: pgvector/pgvector:pg16
    container_name: travel-lms-chatwoot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:?CHATWOOT_POSTGRES_PASSWORD is required}
    volumes:
      - chatwoot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatwoot"]
      interval: 5s
      timeout: 5s
      retries: 20

  chatwoot-redis:
    image: redis:7.4-alpine
    container_name: travel-lms-chatwoot-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${CHATWOOT_REDIS_PASSWORD:?CHATWOOT_REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    volumes:
      - chatwoot-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  chatwoot-prepare:
    image: chatwoot/chatwoot:v4.17.1
    container_name: travel-lms-chatwoot-prepare
    restart: "no"
    environment: &chatwoot-environment
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      FRONTEND_URL: ${CHATWOOT_PUBLIC_URL:-http://localhost:3001}
      FORCE_SSL: ${CHATWOOT_FORCE_SSL:-false}
      ENABLE_ACCOUNT_SIGNUP: ${CHATWOOT_ENABLE_ACCOUNT_SIGNUP:-false}
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:?CHATWOOT_SECRET_KEY_BASE is required}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${CHATWOOT_ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:?CHATWOOT_ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY is required}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${CHATWOOT_ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:?CHATWOOT_ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY is required}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${CHATWOOT_ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:?CHATWOOT_ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT is required}
      POSTGRES_HOST: chatwoot-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD}
      REDIS_URL: redis://:${CHATWOOT_REDIS_PASSWORD}@chatwoot-redis:6379
      REDIS_PASSWORD: ${CHATWOOT_REDIS_PASSWORD}
      ACTIVE_STORAGE_SERVICE: local
      RAILS_LOG_TO_STDOUT: "true"
      LOG_LEVEL: ${CHATWOOT_LOG_LEVEL:-info}
      RAILS_MAX_THREADS: ${CHATWOOT_RAILS_MAX_THREADS:-5}
      MAILER_SENDER_EMAIL: ${CHATWOOT_MAILER_SENDER_EMAIL:-Chatwoot <accounts@example.com>}
      SMTP_ADDRESS: ${CHATWOOT_SMTP_ADDRESS:-}
      SMTP_PORT: ${CHATWOOT_SMTP_PORT:-587}
      SMTP_USERNAME: ${CHATWOOT_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${CHATWOOT_SMTP_PASSWORD:-}
      SMTP_AUTHENTICATION: ${CHATWOOT_SMTP_AUTHENTICATION:-login}
      SMTP_ENABLE_STARTTLS_AUTO: ${CHATWOOT_SMTP_ENABLE_STARTTLS_AUTO:-true}
      FB_APP_ID: ${CHATWOOT_FB_APP_ID:-}
      FB_APP_SECRET: ${CHATWOOT_FB_APP_SECRET:-}
      FB_VERIFY_TOKEN: ${CHATWOOT_FB_VERIFY_TOKEN:-}
      IG_VERIFY_TOKEN: ${CHATWOOT_IG_VERIFY_TOKEN:-}
    volumes:
      - chatwoot-storage-data:/app/storage
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]

  chatwoot-rails:
    image: chatwoot/chatwoot:v4.17.1
    container_name: travel-lms-chatwoot-rails
    restart: unless-stopped
    environment: *chatwoot-environment
    volumes:
      - chatwoot-storage-data:/app/storage
    depends_on:
      chatwoot-prepare:
        condition: service_completed_successfully
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:v4.17.1
    container_name: travel-lms-chatwoot-sidekiq
    restart: unless-stopped
    environment: *chatwoot-environment
    volumes:
      - chatwoot-storage-data:/app/storage
    depends_on:
      chatwoot-prepare:
        condition: service_completed_successfully
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  chatwoot-web:
    image: nginx:1.27-alpine
    container_name: travel-lms-chatwoot-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHATWOOT_PORT:-3001}:8080"
    environment:
      CRM_FRAME_ANCESTOR: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    volumes:
      - ./chatwoot-nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      chatwoot-rails:
        condition: service_started

  app:
    build:
      args:
        NEXT_PUBLIC_CHATWOOT_INBOX_URL: ${CHATWOOT_PUBLIC_URL:-http://localhost:3001}
    environment:
      CHATWOOT_BASE_URL: http://chatwoot-rails:3000
      CHATWOOT_API_ACCESS_TOKEN: ${CHATWOOT_API_ACCESS_TOKEN:-}
      CHATWOOT_WEBHOOK_MAX_AGE_SECONDS: ${CHATWOOT_WEBHOOK_MAX_AGE_SECONDS:-300}
      INTEGRATION_TOKEN_ENCRYPTION_KEY: ${INTEGRATION_TOKEN_ENCRYPTION_KEY:?INTEGRATION_TOKEN_ENCRYPTION_KEY is required}
      NEXT_PUBLIC_CHATWOOT_INBOX_URL: ${CHATWOOT_PUBLIC_URL:-http://localhost:3001}

volumes:
  chatwoot-postgres-data:
  chatwoot-redis-data:
  chatwoot-storage-data:
